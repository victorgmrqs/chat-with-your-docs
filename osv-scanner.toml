# Reviewed advisories the `dependency audit` CI job accepts (CWYD-24).
# Procedure: README § "CI and images" → "Accepting a reviewed advisory".
#
# Every entry needs an `id`, a `reason` (why it does not apply or why it cannot be fixed yet,
# and what would end the exception) and an `ignoreUntil` date at most 90 days away. An entry
# without them, or past its date, fails the job (scripts/check-audit-ignores.py).
#
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"
# ignoreUntil = 2027-02-01
# reason = "Only reachable through <feature> we do not use; fix blocked on <upstream issue>."

[[IgnoredVulns]]
id = "GHSA-g3hv-75wg-m249"
ignoreUntil = 2027-02-21
reason = """minimatch 10.2.6 (glob amplification DoS) is a dev-only dependency of the shadcn CLI \
(shadcn -> ts-morph -> @ts-morph/common): it runs only when a developer adds a component, on \
patterns we write, and is not in any image. Ends when @ts-morph/common moves to minimatch >= 11.0.1 \
(Dependabot npm PR) or on the date above. Accepted in CWYD-24."""
