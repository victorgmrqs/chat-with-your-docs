# Golden dataset for the RAG evaluation (CWYD-11, DOM-20/21).
# Documents: backend/tests/fixtures/documents (generated by scripts/generate_fixtures.py).
# Expected sources: `page` for PDF (1-based), `heading_contains` for Markdown, neither for text;
# `passage_contains` must appear in the matching chunk text.
# Categories: single_source | two_sources | exact_term | not_covered | unrelated.

documents:
  - remote-work-policy.pdf
  - expense-policy.pdf
  - parental-leave-policy.md
  - office-handbook.txt

questions:
  - id: coworking_two_sources
    category: two_sources
    question: Can I work from a coworking space, and what is the monthly reimbursement limit?
    expected_outcome: answered
    expected_sources:
      - filename: remote-work-policy.pdf
        page: 2
        passage_contains: requires prior manager approval
      - filename: expense-policy.pdf
        page: 2
        passage_contains: US$ 250 per month

  - id: exact_term_amount
    category: exact_term
    question: Which policy mentions US$ 250?
    expected_outcome: answered
    expected_sources:
      - filename: expense-policy.pdf
        page: 2
        passage_contains: US$ 250

  - id: coworking_approval_notice
    category: single_source
    question: How far in advance must I request approval to work from a coworking space?
    expected_outcome: answered
    expected_sources:
      - filename: remote-work-policy.pdf
        page: 2
        passage_contains: five business days in advance

  - id: expense_submission_deadline
    category: single_source
    question: Within how many days must expenses be submitted?
    expected_outcome: answered
    expected_sources:
      - filename: expense-policy.pdf
        page: 1
        passage_contains: within 30 days

  - id: parental_leave_duration
    category: single_source
    question: How many weeks of paid parental leave do eligible employees receive?
    expected_outcome: answered
    expected_sources:
      - filename: parental-leave-policy.md
        heading_contains: Duration
        passage_contains: sixteen weeks of paid parental leave

  # A complete answer names the exclusion too, so both sections of the same file are expected.
  - id: parental_leave_eligibility
    category: single_source
    question: Who is eligible for parental leave?
    expected_outcome: answered
    expected_sources:
      - filename: parental-leave-policy.md
        heading_contains: Full-time employees
        passage_contains: at least six months of service
      - filename: parental-leave-policy.md
        heading_contains: Contractors
        passage_contains: Contractors are not covered

  # The policy states it explicitly, so a cited "no" is grounded (decision on CWYD-11).
  - id: contractor_parental_leave
    category: single_source
    question: What is the parental leave policy for contractors?
    expected_outcome: answered
    expected_sources:
      - filename: parental-leave-policy.md
        heading_contains: Contractors
        passage_contains: Contractors are not covered

  - id: office_opening_hours
    category: single_source
    question: What time does the office open?
    expected_outcome: answered
    expected_sources:
      - filename: office-handbook.txt
        passage_contains: opens at 8 a.m.

  - id: meeting_room_booking
    category: single_source
    question: How far ahead can meeting rooms be booked?
    expected_outcome: answered
    expected_sources:
      - filename: office-handbook.txt
        passage_contains: up to two weeks ahead

  - id: leave_split_not_covered
    category: not_covered
    question: Can parental leave be split into several separate periods?
    expected_outcome: insufficient_evidence
    expected_sources: []

  - id: home_office_equipment
    category: not_covered
    question: Does the company pay for a desk and chair for my home office?
    expected_outcome: insufficient_evidence
    expected_sources: []

  - id: unrelated_capital
    category: unrelated
    question: What is the capital of Australia?
    expected_outcome: insufficient_evidence
    expected_sources: []

  - id: unrelated_recipe
    category: unrelated
    question: How do I bake sourdough bread?
    expected_outcome: insufficient_evidence
    expected_sources: []
