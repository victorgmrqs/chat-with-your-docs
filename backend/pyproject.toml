[project]
name = "cwyd-backend"
version = "0.1.0"
description = "Chat With Your Docs API"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "langchain-anthropic>=1.7.12",
    "langchain-openai>=1.7.4",
    "langchain-text-splitters>=1.1.3",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.0.0",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.4",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.2",
    "mypy>=2.4.1",
    "pillow>=13.0.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.6",
    "testcontainers>=4.15.0",
    "types-pyyaml>=6.0.12.20261122",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]   # assert is the point of a test

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]   # same import order on the host and in the dev container

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["reportlab.*"]  # no stubs published; used only by scripts/generate_fixtures.py
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "--strict-markers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs Docker (starts PostgreSQL with testcontainers)",
    "live: calls the real LLM providers (RUN_LIVE_TESTS=1 and provider keys)",
]
filterwarnings = [
    # langsmith (via langchain-core) calls asyncio.iscoroutinefunction, deprecated in 3.14
    "ignore:.*iscoroutinefunction.*:DeprecationWarning:langsmith.*",
]
