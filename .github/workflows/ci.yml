# CI and image publishing (CWYD-6).
#
# changes ─┬─ backend ──┐
#          └─ frontend ─┴─ image (build + scan, per component) ── publish (GHCR) ─┐
#                                                                                 ci-gate
# - Pull requests run the checks of the components they touch, then build and scan those images.
#   Nothing is pushed.
# - Pushes to development/main, version tags and manual runs on development/main build every
#   component and publish both images only when every check and every scan passed.
# - `ci-gate` always reports and is the only required status check: a job skipped by the path
#   filter passes it, a failed or cancelled one fails it.
# Third-party actions are pinned by commit SHA; the comment names the release.

name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # Publishing is authorized on pushes (development, main, tags) and on manual runs from
  # development or main; pull requests never publish.
  PUBLISH: >-
    ${{ github.event_name == 'push'
        || (github.event_name == 'workflow_dispatch'
            && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development')) }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.select.outputs.backend }}
      frontend: ${{ steps.select.outputs.frontend }}
      components: ${{ steps.select.outputs.components }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'db/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
      - id: select
        # Outside pull requests every component is built, so each commit has both images.
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          BACKEND: ${{ steps.filter.outputs.backend }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
        run: |
          if [ "$IS_PR" != "true" ]; then BACKEND=true; FRONTEND=true; fi
          components=$(jq -cn --arg b "$BACKEND" --arg f "$FRONTEND" \
            '[if $b == "true" then "backend" else empty end,
              if $f == "true" then "frontend" else empty end]')
          {
            echo "backend=$BACKEND"
            echo "frontend=$FRONTEND"
            echo "components=$components"
          } >> "$GITHUB_OUTPUT"

  backend:
    name: backend checks
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7" # same uv as backend/Dockerfile
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy .
      - name: Test (integration tests start PostgreSQL with testcontainers)
        run: uv run pytest
      - name: OpenAPI contract is up to date
        run: |
          uv run python -m scripts.export_openapi
          git diff --exit-code -- ../frontend/openapi.json \
            || { echo "::error::frontend/openapi.json is stale: run 'uv run python -m scripts.export_openapi' in backend/"; exit 1; }

  frontend:
    name: frontend checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26" # same major as frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: API types match openapi.json
        run: |
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts \
            || { echo "::error::src/api/schema.d.ts is stale: run 'npm run api:types' in frontend/"; exit 1; }

  image:
    name: image ${{ matrix.component }}
    needs: [changes, backend, frontend]
    # Runs only when no check failed; a check skipped by the path filter does not block.
    if: >-
      !cancelled()
      && needs.changes.outputs.components != '[]'
      && needs.backend.result != 'failure'
      && needs.frontend.result != 'failure'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}
          # sha-<short> on every image; branch name and semver tags as moving pointers.
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Scan (fixable HIGH and CRITICAL vulnerabilities fail the job)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Save the scanned image for publishing
        if: env.PUBLISH == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # shellcheck disable=SC2086 # one argument per tag
          docker save $TAGS | gzip > "${{ matrix.component }}.tar.gz"
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.component }}
          path: ${{ matrix.component }}.tar.gz
          retention-days: 1
          compression-level: 0

  publish:
    name: publish ${{ matrix.component }}
    needs: [changes, image]
    # Every check and every scan must have passed: one failing image blocks both publishes.
    if: >-
      !cancelled()
      && needs.image.result == 'success'
      && (github.event_name == 'push'
          || (github.event_name == 'workflow_dispatch'
              && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.component }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the scanned image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}
        run: |
          gunzip -c "${{ matrix.component }}.tar.gz" | docker load
          docker push --all-tags "$IMAGE"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-${GITHUB_SHA::7}")
          {
            echo "### ${{ matrix.component }}"
            echo
            echo "- Digest: \`$digest\`"
            docker image ls --format '- Tag: `{{.Repository}}:{{.Tag}}`' "$IMAGE"
          } >> "$GITHUB_STEP_SUMMARY"

  ci-gate:
    name: ci-gate
    needs: [changes, backend, frontend, image, publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
