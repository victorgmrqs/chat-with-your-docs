# CI and image publishing (CWYD-6). Triggers, publish rules and the required check are described
# in README § "CI and images".
#
# changes ─┬─ backend ──┐
#          └─ frontend ─┴─ image (build + scan, per component) ── publish (GHCR) ─┐
# skills-drift ───────────────────────────────────────────────────────────────────┤
# dependency-audit ───────────────────────────────────────────────────────────────┤
#                                                                                 ci-gate
# Third-party actions are pinned by commit SHA; the comment names the release.

name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Explicit bash runs with -eo pipefail; the implicit default is only -e, which hides a failure
    # on the left of a pipe (docker push | ..., docker save | gzip).
    shell: bash

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      # Pull requests check and build only what they touch; every other event builds both
      # components, so each published commit has both images.
      backend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ github.event_name != 'pull_request' || steps.filter.outputs.frontend == 'true' }}
      components: ${{ github.event_name == 'pull_request' && steps.filter.outputs.changes || '["backend","frontend"]' }}
      # Publishing is authorized on pushes (development, main, tags) and on manual runs from
      # development or main; pull requests never publish.
      publish: >-
        ${{ github.event_name == 'push'
            || (github.event_name == 'workflow_dispatch'
                && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development')) }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'db/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    name: backend checks
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.7" # same uv as backend/Dockerfile
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy .
      - name: Test (integration tests start PostgreSQL with testcontainers)
        run: uv run pytest
      - name: OpenAPI contract is up to date
        run: |
          uv run python -m scripts.export_openapi
          git diff --exit-code -- ../frontend/openapi.json \
            || { echo "::error::frontend/openapi.json is stale: regenerate it (README § Development)"; exit 1; }

  frontend:
    name: frontend checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26" # same major as frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: API types match openapi.json
        run: |
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts \
            || { echo "::error::src/api/schema.d.ts is stale: regenerate it (README § Development)"; exit 1; }

  skills-drift:
    name: skills drift
    # Always runs (no path filter): a few seconds, and ci-gate must see it on every event.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generated testing guides match their .claude/skills copies
        run: scripts/check-generated-skills.sh

  dependency-audit:
    name: dependency audit
    # Always runs (no path filter): a new advisory against an unchanged lockfile must block too.
    # Accepting a reviewed advisory: osv-scanner.toml (README § "CI and images").
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OSV_SCANNER_VERSION: v2.7.1
      OSV_SCANNER_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Accepted advisories have a reason and an expiry
        run: python3 scripts/check-audit-ignores.py osv-scanner.toml
      - name: Install osv-scanner (release binary, checksum pinned)
        # The release binary is pinned by checksum; the published action pins its image by tag only.
        run: |
          curl -fsSLo osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  osv-scanner" | sha256sum --check --strict
          chmod +x osv-scanner
      - name: Scan backend/uv.lock and frontend/package-lock.json (any known advisory fails)
        run: |
          ./osv-scanner scan source --config=osv-scanner.toml \
            --lockfile=backend/uv.lock --lockfile=frontend/package-lock.json

  image:
    name: image
    needs: [changes, backend, frontend]
    # Runs only when every check passed; a check skipped by the path filter does not block, a
    # failed or cancelled (e.g. timed out) one does.
    if: >-
      !cancelled()
      && needs.changes.result == 'success'
      && needs.changes.outputs.components != '[]'
      && contains(fromJSON('["success","skipped"]'), needs.backend.result)
      && contains(fromJSON('["success","skipped"]'), needs.frontend.result)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
    env:
      PUBLISH: ${{ needs.changes.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}
          # sha-<short> on every image; branch name and semver tags as moving pointers.
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
      - id: epoch
        # Daily value for the Dockerfiles' UPGRADE_EPOCH: the OS security-upgrade layer is
        # rebuilt once a day instead of being served from the build cache indefinitely.
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.component }}
          load: true
          push: false
          build-args: UPGRADE_EPOCH=${{ steps.epoch.outputs.day }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          # Only publishing runs write the cache; pull requests read it.
          cache-to: ${{ env.PUBLISH == 'true' && format('type=gha,mode=max,scope={0}', matrix.component) || '' }}
      - name: Scan (fixable HIGH and CRITICAL vulnerabilities fail the job)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Save the scanned image for publishing
        if: env.PUBLISH == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # shellcheck disable=SC2086 # one argument per tag
          docker save $TAGS | gzip > "${{ matrix.component }}.tar.gz"
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.component }}
          path: ${{ matrix.component }}.tar.gz
          retention-days: 1
          compression-level: 0

  publish:
    name: publish
    needs: [changes, image]
    # The implicit success() requires every image (check + scan) to have passed: one failure
    # publishes nothing.
    if: needs.changes.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    strategy:
      # A failed push must not cancel the other component's push halfway.
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.component }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the scanned image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}
        run: |
          gunzip -c "${{ matrix.component }}.tar.gz" | docker load
          # Every tag points to the same manifest; the registry reports its digest on push.
          docker push --all-tags "$IMAGE" | tee push.log
          digest=$(grep -m 1 -oE 'sha256:[0-9a-f]{64}' push.log) \
            || { echo "::error::docker push reported no digest"; exit 1; }
          {
            echo "### ${{ matrix.component }}"
            echo
            echo "- Digest: \`$IMAGE@$digest\`"
            docker image ls --format '- Tag: `{{.Repository}}:{{.Tag}}`' "$IMAGE"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  ci-gate:
    name: ci-gate
    needs: [changes, backend, frontend, skills-drift, dependency-audit, image, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
