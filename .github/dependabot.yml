# Dependabot version updates (CWYD-24); schedule and grouping: docs/development.md § "CI and images".
# Security updates (repository setting) stay off: they always target the default branch (main);
# the `dependency audit` CI job blocks vulnerable dependencies instead.

version: 2

updates:
  - package-ecosystem: uv
    directory: /backend
    target-branch: development
    schedule:
      interval: weekly
      day: monday
    groups:
      backend-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /frontend
    target-branch: development
    schedule:
      interval: weekly
      day: monday
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directories: [/backend, /frontend, /db, /.devcontainer]
    target-branch: development
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker-compose
    directory: /
    target-branch: development
    schedule:
      interval: weekly
      day: monday
    groups:
      compose-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
