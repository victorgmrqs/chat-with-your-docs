# dev-workflow — per-project configuration
# Generated by /setup-project (2026-11-20). Single source of parameters for
# /task, /code-review-task, /docs-sync and /sprint.

schema_version: 1

platforms:
  - claude-code

project:
  name: "Chat With Your Docs"
  language: en                   # every artifact in English (international role)
  repo_role: single              # monorepo: backend/ + frontend/
  canonical_docs_path: "."
  rules_pack: ""

tracker:
  provider: jira
  mcp_server: "claude.ai Atlassian MCP"   # official Atlassian connector exposed by Claude Code
  project_key: CWYD
  cloud_id: "a5d8b89b-37c5-4fd9-b536-5c5f662822fe"
  url: "https://goncalvesmarques.atlassian.net"
  board_id: 138
  ticket_prefix_guard: ""        # single repo: [backend]/[frontend]/[infra]/[docs] cards all live here
  columns:                       # verified against project CWYD statuses on 2026-11-20
    todo: "To Do"
    in_progress: "In Progress"
    in_review: "In Review"
    done: "Done"

git:
  base_branch: development       # feat/* → PR → development; release merges development → main
  branch_pattern: "feat/{ticket}-{slug}"
  commit_pattern: "{type}({ticket}): {message}"   # commits and PRs never mention AI (see AGENTS.md)

commands:
  # Run from the repository root inside the dev container (dev dependencies are not in the images).
  lint: "(cd backend && uv run ruff check . && uv run ruff format --check .) && npm --prefix frontend run lint"
  typecheck: "(cd backend && uv run mypy .) && npm --prefix frontend run typecheck"
  test: "(cd backend && uv run pytest) && npm --prefix frontend test"
  coverage: ""                   # no gate, see quality_gates
  build: "docker compose build"
  e2e: ""                        # TODO(CWYD-8): Playwright

quality_gates:
  review_pack: python-async      # backend (FastAPI/LangChain) carries most of the risk.
                                 # TODO: no pack covers React + Vite; react-next is Next.js-specific.
  coverage_threshold: null       # playbook rule: declare what is worth testing, never chase a percentage
  coverage_strict_paths: {}

domains: []
  # TODO: no FDDs yet. Cards are prefixed by area ([backend], [frontend], [infra], [docs]),
  # not by domain key; add entries here if per-area design docs are written.

context_files:                   # always loaded in /task phase 1 (≤4)
  - AGENTS.md
  - _docs/playbook.md            # local working guide (untracked); stack, RAG, testing, Jira plan

docs_map:
  - if_diff_touches: "compose*.y*ml"
    update: ["README.md"]        # Quick setup section
    severity: blocker
  - if_diff_touches: ".env.example"
    update: ["README.md"]
    severity: blocker
  - if_diff_touches: "backend/pyproject.toml"
    update: ["README.md"]        # stack / setup
    severity: warning
  - if_diff_touches: "frontend/package.json"
    update: ["README.md"]
    severity: warning
  - if_diff_touches: "backend/app/config.py"
    update: [".env.example", "README.md"]   # every setting is documented in both
    severity: warning
  - if_diff_touches: "db/**"
    update: ["README.md"]
    severity: warning
  - if_diff_touches: "**/Dockerfile"
    update: ["README.md"]
    severity: warning
  # TODO(CWYD-5): contract-first rule once the API client exists:
  # - if_diff_touches: "backend/app/api/**"
  #   update: ["frontend/src/api/schema.d.ts"]   # regenerate with openapi-typescript
  #   severity: blocker
  # TODO(CWYD-11): eval script/dataset changes → docs/eval/ report

documentation_policy:
  changelog:
    required_for_every_task: true
    path: CHANGELOG.md
    section: Unreleased
    require_ticket_link: true     # [CWYD-12](https://goncalvesmarques.atlassian.net/browse/CWYD-12)
    allowed_categories: [Added, Changed, Fixed, Security, Deprecated, Removed, Maintenance]
  technical:
    source_of_truth: repository
    paths: [README.md, docs/]
  functional:
    source_of_truth: repository   # Confluence disabled: the evaluator only sees the GitHub repo

evidence:
  type: http                     # .http files run by a human against `docker compose up`
  path: "docs/http/"
  # Frontend cards also attach screenshots compared against _docs/design/imgs/*.png

confluence:
  enabled: false
  mcp_server: "claude.ai Atlassian MCP"
  space: ""
  business_docs: []

dod_extra:
  - "[ ] Manual run: `docker compose up` + the card's `.http` file exercised by a human (green tests are not enough)"
  - "[ ] English only: code, comments, docs, commit messages"
  - "[ ] /simplify run on the change before committing"
  - "[ ] Domain and use cases import no provider SDK (ports/adapters); model names come from configuration"
  - "[ ] No question, prompt, chunk or answer content in logs or span attributes (CAPTURE_CONTENT=false by default)"
  - "[ ] Frontend: design tokens only (no hardcoded colors); screens match the _docs/design PNGs"

integrations:
  atlassian:
    capability_discovery: true
    fallback: local

loop:
  enabled: false
  scope_jql: "sprint in openSprints()"
  repo_label: ""
  required_check: ""
  max_cards: 8
  merge_method: merge
  stop_file: .loop-stop
  poll_seconds: 480
  qa_marker: "QA after merge: yes"
  external_review_cmd: ""
  confluence_mode: pending
  confluence_append_pages: []
  confluence_child_parents: []
  confluence_max_added: 10
  confluence_review: none
  high_risk_flags:
    - db_migration_required
    - external_contract_change
    - manual_apply_required
  protected_paths:
    - .github/
    - .claude/
    - .dev-workflow/
    - scripts/loop/
    - scripts/docs-guard.sh
  labels:
    opt_in: auto-ok
    owned: sprint-auto
    human: requires-human
    recheck: recheck
    qa_pending: qa-pending
    confluence_pending: confluence-pending
